<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Campus</title>
  <link rel="icon" type="image/png" href="assets/cat-icon.png">
  <link rel="apple-touch-icon" href="assets/cat-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260927c" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="top-left">
      <button class="side-toggle" id="burger" aria-label="Open menu">
        <img src="assets/cat-icon.png" alt="Menu" class="burger-cat" id="burgerCat">
      </button>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
      </button>
      <button class="icon-btn notif-btn" id="notifBtn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="notif-badge hidden" id="notifBadge"></span>
      </button>
      <a href="/login" class="btn-login">Log in</a>
      <a href="/download" class="btn-dl">DOWNLOAD</a>
    </div>
  </header>

  <aside class="cat-drawer" id="catDrawer">
    <nav class="cd-nav">
      <a href="/">Home</a>
      <a href="/rooms">Rooms</a>
      <a href="/messages">Messages</a>
      <a href="/#feed">Creative Program</a>
      <a href="/patch-notes">Patch Notes</a>
      <a href="/support">Support</a>
      <a href="/news">News</a>
      <a href="/challenges">Challenges</a>
      <a href="/download">Download</a>
      <a href="https://discord.gg/xH8MMwK5Bk" target="_blank" rel="noopener">Discord</a>
      <a href="/accessibility">Accessibility</a>
    </nav>
    <button class="cd-theme-toggle"></button>
  </aside>
  <div class="side-scrim" id="scrim"></div>

  <!-- PROFILE -->
  <main id="main" class="profile-page">
    <div class="profile-banner"></div>

    <div class="profile-layout">
      <!-- LEFT INFO SIDEBAR -->
      <aside class="profile-side">
        <img class="profile-pic" id="profilePic" alt="">
        <h1 class="profile-username" id="profileUsername">Username</h1>
        <span class="profile-handle" id="profileHandle">@handle</span>
        <div class="profile-actions" id="profileActions"></div>

        <div class="profile-status" id="profileStatus" hidden><span class="status-dot"></span><span class="status-text"></span></div>
        <a class="spotify-now profile-spotify" id="profileSpotify" hidden target="_blank" rel="noopener"></a>
        <div class="profile-socials" id="profileSocials" hidden></div>
        <p class="profile-bio" id="profileBio">this is my bio</p>
        <div class="profile-joined" id="profileJoined">
          <svg viewBox="0 0 20 20" fill="none" width="15" height="15"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8h14M7 2.5v3M13 2.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="joined-text"></span>
        </div>

        <div class="profile-statbox">
          <div class="statbox-row" id="statFriendsRow"><strong id="statFriends">16</strong> Friends</div>
          <div class="statbox-row" id="statSubsRow"><strong id="statSubs">2</strong> Subscribers</div>
          <div class="statbox-sub" id="profileSubscribe"></div>
        </div>

        <div class="friend-panel" id="friendPanel"></div>
        <div id="profileReportWrap"></div>
      </aside>

      <!-- RIGHT MAIN -->
      <section class="profile-main">
        <div class="profile-tabs">
          <button class="ptab active" data-tab="photos" title="Photos they took" aria-label="Photos they took"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="11" r="2" stroke="currentColor" stroke-width="1.6"/><path d="m4 18 5-4 4 3 3-3 4 4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
          <button class="ptab" data-tab="tagged" title="Tagged in" aria-label="Photos they're tagged in"><svg viewBox="0 0 24 24" fill="none"><path d="M20.6 13.4 12 22l-8.6-8.6a2 2 0 0 1 0-2.8l7.2-7.2a2 2 0 0 1 1.4-.6H19a2 2 0 0 1 2 2v6.2a2 2 0 0 1-.4 1.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="16.5" cy="7.5" r="1.4" fill="currentColor"/></svg></button>
          <button class="ptab" data-tab="rooms" title="Rooms" aria-label="Rooms"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1v-8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
          <button class="ptab" data-tab="events" title="Events" aria-label="Events"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </div>

        <div class="profile-panel active" data-panel="photos">
          <div class="profile-photos" id="profilePhotos"></div>
        </div>
        <div class="profile-panel" data-panel="tagged">
          <div class="profile-photos" id="profilePhotosTagged"></div>
        </div>
        <div class="profile-panel" data-panel="rooms">
          <div class="profile-rooms" id="profileRooms"></div>
        </div>
        <div class="profile-panel" data-panel="events">
          <div class="profile-events" id="profileEvents"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- SEARCH PANEL -->
  <div class="search-panel" id="searchPanel">
    <div class="search-card">
      <div class="search-tabs">
        <button class="stab active" data-tab="people">People</button>
        <button class="stab" data-tab="rooms">Rooms</button>
      </div>
      <div class="search-field">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
        <input type="text" id="searchInput" placeholder="Search people…" autocomplete="off">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <div class="search-scrim" id="searchScrim"></div>

  <script src="data.js?v=20260927c"></script>

  <script src="app.js?v=20260927c"></script>
</body>
</html>
